services:

  mysql:
    image: mysql:8.0
    container_name: pdm_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: predictive_maintenance

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pdm_mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"
      - "9001:9001"

    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: pdm_backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started

    env_file:
      - ./backend/.env.docker

    environment:
      ENV_FILE: .env.docker

    ports:
      - "8000:8000"

  mqtt_subscriber:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: pdm_subscriber
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
      backend:
        condition: service_started

    env_file:
      - ./backend/.env.docker

    environment:
      ENV_FILE: .env.docker

    command: python -m app.mqtt.subscriber

  digital_twin:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: pdm_digital_twin
    restart: unless-stopped

    depends_on:
      mosquitto:
        condition: service_started
      mqtt_subscriber:
        condition: service_started

    env_file:
      - ./backend/.env.docker

    environment:
      ENV_FILE: .env.docker

    command: python -m app.mqtt.publisher

volumes:
  mysql_data:
